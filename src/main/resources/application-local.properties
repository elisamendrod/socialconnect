# Demonstracao local sem Docker. Os dados sao mantidos durante a execucao.
spring.datasource.url=jdbc:h2:mem:socialconnect;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration,classpath:db/local
